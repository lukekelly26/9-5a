<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Escape From The 9-5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15140f;
    --paper: #f3eee0;
    --ink: #2a2519;
    --ink-soft: #766e58;
    --text: #efeadd;
    --text-dim: #8b8471;
    --gold: #b8923f;
    --stamp: #a23f2e;
    --line: #2a2822;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 56px 20px 90px;
    line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family:'Poppins', sans-serif;
    font-weight: 500; }
  #app{ width:100%; max-width: 580px; }

  .file-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 30px;
  }
  .file-header .label{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .file-header .count{
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--gold);
  }
  .progress-track{
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    margin-bottom: 40px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .card{
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 40px 36px 34px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
  }
  .q-eyebrow{
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .q-prompt{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: clamp(21px, 4.2vw, 25px);
    line-height: 1.35;
    letter-spacing: -0.005em;
    margin: 0 0 28px;
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex;
    align-items:center;
    gap: 14px;
    text-align:left;
    background: transparent;
    border: 1px solid rgba(42,37,25,0.22);
    border-radius: var(--radius);
    padding: 15px 18px;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:hover{ background: rgba(42,37,25,0.05); border-color: var(--ink); }
  .option:active{ transform: scale(0.995); }
  .option .dot{
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-soft);
    flex-shrink:0;
  }
  .option:hover .dot{ border-color: var(--gold); background: var(--gold); }

  .text-field{
    width: 100%;
    border: none;
    border-bottom: 2px solid rgba(42,37,25,0.25);
    background: transparent;
    font-family: 'Poppins', sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: 19px;
    color: var(--ink);
    padding: 10px 2px 12px;
    outline: none;
  }
  .text-field:focus{ border-bottom-color: var(--gold); }
  .text-field::placeholder{ color: rgba(42,37,25,0.35); font-style: italic; }
  .continue-btn{
    display:block;
    width: 100%;
    margin-top: 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    padding: 15px 20px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .continue-btn:hover{ background: #cca64a; }
  .continue-btn:active{ transform: scale(0.99); }
  .skip-note{
    margin-top: 12px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .progress-note{
    margin-top:22px;
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    letter-spacing: 0.05em;
  }

  .stamp{
    display:inline-block;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--stamp);
    border: 1.5px solid var(--stamp);
    padding: 5px 12px;
    border-radius: 4px;
    transform: rotate(-2deg);
    opacity: 0;
    animation: stampIn 0.5s ease 0.1s forwards;
    margin-bottom: 22px;
  }
  @keyframes stampIn{
    0%{ opacity:0; transform: rotate(-2deg) scale(1.3); }
    100%{ opacity:1; transform: rotate(-2deg) scale(1); }
  }
  .result-title{
    font-family:'Poppins', sans-serif;
    font-size: clamp(30px, 7vw, 42px);
    font-weight: 700;
    color: var(--text);
    margin: 0 0 14px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .result-rule{
    width: 40px;
    height: 2px;
    background: var(--gold);
    margin: 0 0 18px;
  }
  .result-tag{
    font-family: 'Poppins', sans-serif;
    font-style: italic;
    font-weight: 500;
    color: var(--text-dim);
    font-size: 17px;
    margin: 0 0 26px;
    line-height: 1.4;
  }

  .finding-label{
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .finding-text{
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 30px;
  }

  .report-sheet{
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 6px 32px 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
  }
  .report-section{
    padding: 26px 0;
    border-top: 1px solid rgba(42,37,25,0.12);
  }
  .report-section:first-child{ border-top:none; padding-top: 30px; }

  /* ---- teaser stats: fully sharp, sits right above the blur line to hint at value ---- */
  .teaser-stats{
    display: flex;
    gap: 8px;
    background: var(--paper);
    border-radius: var(--radius);
    padding: 22px 16px;
    margin: 4px 0 26px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.22);
  }
  .teaser-stat{
    flex: 1;
    text-align: center;
  }
  .teaser-stat .num{
    font-weight: 700;
    font-size: 34px;
    color: var(--stamp);
    line-height: 1;
    margin-bottom: 8px;
  }
  .teaser-stat .lbl{
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .report-section h3{
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .report-section p{ margin: 0; font-size: 15.5px; line-height: 1.65; }
  .report-section ul{ margin: 0; padding-left: 0; list-style: none; }
  .report-section li{
    margin-bottom: 13px;
    font-size: 15.5px;
    line-height: 1.65;
    padding-left: 18px;
    position: relative;
  }
  .report-section li::before{
    content: "–";
    position: absolute;
    left: 0;
    color: var(--gold);
  }
  .report-section li:last-child{ margin-bottom: 0; }

  .quote{
    font-family: 'Poppins', sans-serif;
    font-style: italic;
    font-weight: 600;
    color: #8a6a1e;
  }
  .key{
    font-weight: 700;
    color: var(--stamp);
  }

  .blueprint{ list-style: none; margin: 0; padding: 0; }
  .blueprint li{
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 18px;
    font-size: 15.5px;
    line-height: 1.6;
    padding-left: 0;
  }
  .blueprint li::before{ content:none; }
  .blueprint li:last-child{ margin-bottom: 0; }
  .step-num{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--gold);
    border: 1.5px solid var(--gold);
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .locked-zone{ position: relative; margin-top: 30px; }
  .locked-content{
    filter: blur(22px);
    user-select: none;
    pointer-events: none;
  }
  .unlock-overlay{
    position:fixed;
    inset: 0;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 12px;
    text-align:center;
    padding: 24px;
    background: rgba(21,20,15,0.86);
    z-index: 10;
  }
  .unlock-overlay .lock-copy{
    font-size: 14px;
    color: var(--text-dim);
    max-width: 360px;
    line-height: 1.5;
  }
  .unlock-btn{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 15px 28px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .unlock-btn:hover{ background: #cca64a; }
  .unlock-btn:active{ transform: scale(0.98); }
  .unlock-sub{ font-size: 11px; color: var(--text-dim); font-family:'Poppins', sans-serif;
    font-weight: 500; letter-spacing:0.03em; }

  .retake{
    display:block;
    margin: 30px auto 0;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 10px 0;
    cursor: pointer;
  }
  .retake:hover{ color: var(--gold); }

  .intro{ text-align: center; padding: 20px 6px; }
  .intro-eyebrow{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }
  .intro-title{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 9vw, 50px);
    line-height: 1.08;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--text);
    margin: 0 0 20px;
  }
  .intro-sub{
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-dim);
    max-width: 420px;
    margin: 0 auto 34px;
  }
  .begin-btn{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 16px 34px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .begin-btn:hover{ background: #cca64a; }
  .begin-btn:active{ transform: scale(0.98); }
  .intro-note{
    margin-top: 16px;
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .greeting{
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .reveal-headline{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: clamp(20px, 4.6vw, 25px);
    color: var(--text);
    line-height: 1.35;
    margin: 0 0 24px;
  }

  /* ---- roadmap diagram ---- */
  .roadmap{ margin: 0; }
  .roadmap-stage{
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 16px;
    margin-bottom: 26px;
  }
  .roadmap-stage:last-child{ margin-bottom: 0; }
  .roadmap-node-col{ position: relative; display: flex; justify-content: center; }
  .roadmap-node-col::before{
    content:"";
    position: absolute;
    top: 28px;
    bottom: -26px;
    width: 2px;
    background: rgba(42,37,25,0.18);
    left: 50%;
    transform: translateX(-50%);
  }
  .roadmap-stage:last-child .roadmap-node-col::before{ display:none; }
  .roadmap-dot{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: var(--paper);
    color: var(--gold);
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .roadmap-stage-label{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .roadmap-stage-label .rs-focus{ color: var(--gold); }
  .roadmap-action{
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .roadmap-branches{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .roadmap-branch{
    flex: 1 1 150px;
    border-radius: 4px;
    padding: 11px 13px;
    font-size: 13px;
    line-height: 1.5;
  }
  .roadmap-branch .rb-tag{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 5px;
  }
  .roadmap-branch.good{ background: rgba(184,146,63,0.14); border: 1px solid rgba(184,146,63,0.4); }
  .roadmap-branch.good .rb-tag{ color: #8a6a1e; }
  .roadmap-branch.typical{ background: transparent; border: 1px solid rgba(42,37,25,0.22); }
  .roadmap-branch.typical .rb-tag{ color: var(--ink); }
  .roadmap-branch.slow{ background: rgba(42,37,25,0.04); border: 1px dashed rgba(42,37,25,0.28); }
  .roadmap-branch.slow .rb-tag{ color: var(--ink-soft); }

  /* ---- make it happen checklist ---- */
  .action-list{ list-style: none; margin: 0; padding: 0; }
  .action-item{
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .action-item:last-child{ margin-bottom: 0; }
  .action-check{
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    margin-top: 2px;
  }
  .action-label{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 4px;
  }
  .action-text{ font-size: 15.5px; line-height: 1.55; font-weight: 500; }

  /* ---- email report ---- */
  .email-row{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .email-input{
    flex: 1 1 200px;
    border: 1px solid rgba(42,37,25,0.25);
    border-radius: var(--radius);
    background: transparent;
    padding: 13px 14px;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }
  .email-input:focus{ border-color: var(--gold); }
  .email-input::placeholder{ color: rgba(42,37,25,0.4); }
  .email-btn{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.03em;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    padding: 13px 18px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .email-btn:hover{ background: #cca64a; }
  .email-btn:active{ transform: scale(0.99); }
  .email-status{
    margin-top: 10px;
    font-size: 13px;
    font-weight: 500;
  }
  .email-status.error{ color: var(--stamp); }
  .email-status.success{ color: #6d5a15; }
  .email-note{
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---- closing call to action ---- */
  .cta-block{
    margin-top: 8px;
    background: var(--gold);
    color: var(--bg);
    border-radius: var(--radius);
    padding: 30px 28px;
    text-align: center;
  }
  .cta-label{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 12px;
  }
  .cta-headline{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(19px, 4.6vw, 24px);
    line-height: 1.3;
    margin: 0 0 16px;
  }
  .cta-action{
    background: rgba(21,20,15,0.1);
    border-radius: 4px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    margin: 0 0 14px;
  }
  .cta-sub{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.05em;
    opacity: 0.75;
  }

  @media (prefers-reduced-motion: reduce){
    .stamp{ animation: none; opacity:1; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUESTIONS = [
  {
    id:'name',
    type:'text',
    prompt:()=>'First things first — what should we call you?',
    placeholder:'Your first name',
    cta:'Continue'
  },
  {
    id:'job',
    type:'text',
    prompt:(a)=>`Good to meet you${a.name ? ', ' + a.name.label : ''}. What do you currently do for work?`,
    placeholder:'e.g. Retail assistant, teacher, accountant, nurse...',
    cta:'Continue'
  },
  {
    id:'skill',
    type:'select',
    prompt:(a)=>`Alright${a.name ? ', ' + a.name.label : ''} — which of these feels most like you?`,
    options:[
      {label:'Business, money, and numbers', pts:{FREELANCE:1,INVEST:2,AUTOMATE:1}},
      {label:'Health, fitness, and how bodies work', pts:{COACH:2,LOCAL:2}},
      {label:'Making things — writing, design, or music', pts:{PRODUCT:2,CONTENT:2}},
      {label:'Games, sports, or hands-on hobbies', pts:{RESALE:2,LOCAL:1}}
    ]
  },
  {
    id:'time',
    type:'select',
    prompt:(a)=>`Realistically, around your job${a.job ? ' as a ' + a.job.label.toLowerCase() : ''}, how many hours a week could you actually give this?`,
    options:[
      {label:'Under 5 hours', pts:{PRODUCT:1,INVEST:1}},
      {label:'5 to 15 hours', pts:{FREELANCE:1,CONTENT:1,COACH:1}},
      {label:'15 hours or more', pts:{AUTOMATE:2,LOCAL:1,RESALE:1}}
    ]
  },
  {
    id:'capital',
    type:'select',
    prompt:()=>'How much money can you put in before you see any back?',
    options:[
      {label:'Basically nothing', pts:{CONTENT:2,FREELANCE:1}},
      {label:'Up to £500', pts:{PRODUCT:1,COACH:1}},
      {label:'£500 to £5,000', pts:{RESALE:2,AUTOMATE:1}},
      {label:'More than £5,000', pts:{INVEST:3}}
    ]
  },
  {
    id:'risk',
    type:'select',
    prompt:()=>"When something risky could pay off big, or fail completely — what's your gut?",
    options:[
      {label:'I want something steady, not a gamble', pts:{FREELANCE:1,LOCAL:1,COACH:1}},
      {label:"I'll take calculated risks for a real payoff", pts:{RESALE:1,AUTOMATE:1}},
      {label:"I'm comfortable swinging for something bigger", pts:{INVEST:2,RESALE:1}}
    ]
  },
  {
    id:'tuesday',
    type:'select',
    prompt:(a)=>`Forget ${a.job ? 'being a ' + a.job.label.toLowerCase() : 'work'} for a second — which sounds more like a good Tuesday to you?`,
    options:[
      {label:'Talking to a client or student one-on-one', pts:{FREELANCE:1,COACH:2}},
      {label:'Building something once that works while I sleep', pts:{PRODUCT:2,AUTOMATE:2}},
      {label:'Posting, writing, or creating something people see', pts:{CONTENT:2}},
      {label:'Hunting for a deal, a find, or an opportunity', pts:{RESALE:2,INVEST:1}}
    ]
  },
  {
    id:'audience',
    type:'select',
    prompt:()=>'Do you already have people paying attention to you online — a following, a list, a community?',
    options:[

function bySkill(p, opts){
  const map = {
    'Business, money, and numbers': opts.A,
    'Health, fitness, and how bodies work': opts.B,
    'Making things — writing, design, or music': opts.C,
    'Games, sports, or hands-on hobbies': opts.D
  };
  return map[p.skill] || opts.A;
}

let current = 0;
const answers = {};
const SELECT_COUNT = QUESTIONS.filter(q=>q.type==='select').length;

function computeResult(){
  const totals = {};
  Object.keys(ARCHETYPES).forEach(k=> totals[k]=0);
  QUESTIONS.forEach(q=>{
    const chosen = answers[q.id];
    if(!chosen || !chosen.pts) return;
    Object.entries(chosen.pts).forEach(([k,v])=>{ totals[k]=(totals[k]||0)+v; });
  });
  const ranked = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  return { topKey: ranked[0][0], runnerKey: ranked[1][0] };
}

function buildProfile(){
  return {
    name: answers.name ? answers.name.label : '',
    job: answers.job ? answers.job.label : '',
    escape: answers.escape ? answers.escape.label : "the parts of the day that aren't really yours",
    skill: answers.skill.label,
    time: answers.time.label,
    timeLower: answers.time.label.toLowerCase(),
    capital: answers.capital.label,
    capitalLower: answers.capital.label.toLowerCase(),
    risk: answers.risk.label,
    tuesday: answers.tuesday.label,
    audience: answers.audience.label,
    audienceLower: answers.audience.label.toLowerCase(),
    teachfix: answers.teachfix.label,
    peoplebehind: answers.peoplebehind.label,
    incomeGoal: answers.incomeGoal.label,
    incomeGoalLower: answers.incomeGoal.label.toLowerCase()
  };
}

function stripHtml(str){
  return str.replace(/<[^>]+>/g, '');
}

function buildReportText(profile, top, runner){
  const lines = [];
  lines.push(`YOUR ESCAPE ROUTE: ${top.title}`);
  lines.push(top.tag);
  lines.push('');
  lines.push('THE VERDICT');
  lines.push(stripHtml(top.verdict(profile)));
  lines.push('');
  lines.push('YOUR BLUEPRINT');
  top.blueprint(profile).forEach((s,i)=> lines.push(`${i+1}. ${stripHtml(s)}`));
  lines.push('');
  lines.push('HOW TO MAKE THIS HAPPEN');
  top.makeItHappen.forEach(a=> lines.push(`${a.when.toUpperCase()}: ${a.text}`));
  lines.push('');
  lines.push(`YOUR BACKUP ROUTE: ${runner.title} — ${runner.tag}`);
  lines.push('');
  lines.push('(This is a condensed version of your full report.)');
  return lines.join('\n');
}

function buildReportPayload(email, profile, top, runner){
  return {
    email,
    title: top.title,
    tag: top.tag,
    verdict: stripHtml(top.verdict(profile)),
    why: top.why(profile).map(stripHtml),
    blueprint: top.blueprint(profile).map(stripHtml),
    roadmap: top.roadmap,
    expect: stripHtml(top.expect(profile)),
    mistakes: top.mistakes(profile).map(stripHtml),
    makeItHappen: top.makeItHappen,
    runnerTitle: runner.title,
    runnerTag: runner.tag
  };
}

function renderIntro(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="intro">
      <div class="intro-eyebrow">The Escape Assessment</div>
      <h1 class="intro-title">Find Your Escape<br>From The 9–5</h1>
      <p class="intro-sub">A few honest questions about your job, your time, your money, and your risk tolerance — and one realistic way out, built around your actual life, not someone else's success story.</p>
      <button class="begin-btn" id="beginBtn">Begin the Assessment</button>
      <div class="intro-note">Takes about 2 minutes · Nothing is saved</div>
    </div>
  `;
  document.getElementById('beginBtn').addEventListener('click', renderQuestion);
}

function selectStepLabel(){
  const q = QUESTIONS[current];
  if(q.type !== 'select') return '';
  const doneBefore = QUESTIONS.slice(0,current).filter(x=>x.type==='select').length;
  return `${doneBefore+1} / ${SELECT_COUNT}`;
}

function renderQuestion(){
  const q = QUESTIONS[current];
  const app = document.getElementById('app');
  const pct = (current / QUESTIONS.length) * 100;
  const promptText = q.prompt(answers);

  const bodyHtml = q.type === 'select'
    ? `
      <div class="options">
        ${q.options.map((o,i)=>`
          <button class="option" data-idx="${i}">
            <span class="dot"></span><span>${o.label}</span>
          </button>
        `).join('')}
      </div>
    `
    : `
      <input type="text" class="text-field" id="textInput" placeholder="${q.placeholder}" autocomplete="off" />
      <button class="continue-btn" id="continueBtn">${q.cta}</button>
    `;

  app.innerHTML = `
    <div class="file-header">
      <div class="label">Escape Assessment</div>
      <div class="count mono">${q.type==='select' ? selectStepLabel() : ''}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="q-eyebrow">Question ${current+1} of ${QUESTIONS.length}</div>
      <p class="q-prompt">${promptText}</p>
      ${bodyHtml}
    </div>
    <div class="progress-note">This stays between you and your exit plan.</div>
  `;

  const advance = (label)=>{
    answers[q.id] = { label, pts:{} };
    current++;
    if(current < QUESTIONS.length){
      renderQuestion();
    } else {
      renderResult();
    }
  };

  if(q.type === 'select'){
    app.querySelectorAll('.option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.getAttribute('data-idx'));
        answers[q.id] = q.options[idx];
        current++;
        if(current < QUESTIONS.length){
          renderQuestion();
        } else {
          renderResult();
        }
      });
    });
  } else {
    const input = document.getElementById('textInput');
    const btn = document.getElementById('continueBtn');
    input.focus();
    const submit = ()=>{
      const val = input.value.trim();
      advance(val || (q.id === 'job' ? 'your current job' : ''));
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  }
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const canceled = params.get('canceled');

  if(sessionId){
    window.history.replaceState({}, '', window.location.pathname);
    try{
      const resp = await fetch(`/api/verify-session?session_id=${encodeURIComponent(sessionId)}`);
      const data = await resp.json();
      const saved = localStorage.getItem('escapeRouteAnswers');
      if(data.paid && saved){
        Object.assign(answers, JSON.parse(saved));
        renderResult(true);
        return;
      }
    } catch(e){ /* fall through to intro below */ }
    renderIntro();
    return;
  }

  if(canceled){
    window.history.replaceState({}, '', window.location.pathname);
    const saved = localStorage.getItem('escapeRouteAnswers');
    if(saved){
      try{
        Object.assign(answers, JSON.parse(saved));
        renderResult(false);
        return;
      } catch(e){ /* fall through to intro below */ }
    }
  }

  renderIntro();
}

init();
</script>

</body>
</html>
